# Build and deploy versioned documentation with MkDocs + mike.
# - Pushing a tag matching v* deploys a versioned release and updates the "latest" alias.
# - Pushing to the dev branch (re)deploys the "dev" version.
# The workflow_dispatch trigger allows manual deploys with a custom version/alias.

name: Deploy Docs

on:
  push:
    tags:
      - "v*"
    branches:
      - dev
  workflow_dispatch:
    inputs:
      version:
        description: "Version identifier to deploy (e.g. 1.2 or dev)"
        required: true
        default: "dev"
      alias:
        description: "Optional alias to update (e.g. latest). Leave empty for none."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "mkdocs-material==9.7.1" \
            "mike>=2.1,<3"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true

      - name: Deploy release version (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mike deploy --push --update-aliases "$VERSION" latest
          mike set-default --push latest

      - name: Deploy dev version (branch push)
        if: github.ref == 'refs/heads/dev'
        run: |
          mike deploy --push dev

      - name: Deploy version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "${{ github.event.inputs.alias }}" ]; then
            mike deploy --push --update-aliases \
              "${{ github.event.inputs.version }}" "${{ github.event.inputs.alias }}"
          else
            mike deploy --push "${{ github.event.inputs.version }}"
          fi
